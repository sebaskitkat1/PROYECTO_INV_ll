[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["venv", "build", "dist", "scripts/simulacion/resultados"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"app/data/mock_data.py" = ["E501"]
"scripts/simulacion/run_simulacion.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
exclude = ["^venv/", "^build/", "^dist/"]
